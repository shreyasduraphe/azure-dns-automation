name: Label DNS Zone Requests

on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Apply dns-zone-request label if DNS form
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            // Check if this looks like the DNS zone request form
            const isDnsRequest =
              body.includes("Zone FQDN") &&
              body.includes("Ticket Number") &&
              body.includes("Justification");

            if (isDnsRequest) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                labels: ["dns-zone-request"]
              });
              console.log("Label applied: dns-zone-request");
            } else {
              console.log("Not a DNS zone request — skipping.");
            }
