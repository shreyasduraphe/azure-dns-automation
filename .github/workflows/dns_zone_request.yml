name: Process DNS Zone Request

on:
  issues:
    types: [labeled]

jobs:
  process:
    # Only run when the dns-zone-request label is applied
    if: github.event.label.name == 'dns-zone-request'
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            requests \
            azure-identity \
            azure-mgmt-privatedns

      - name: Process zone request
        id: process
        env:
          ISSUE_BODY:              ${{ github.event.issue.body }}
          ISSUE_NUMBER:            ${{ github.event.issue.number }}
          ISSUE_AUTHOR:            ${{ github.event.issue.user.login }}
          AZURE_CLIENT_ID:         ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:     ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID:         ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID:   ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          DNS_RESOURCE_GROUP:      ${{ secrets.DNS_RESOURCE_GROUP }}
          GITHUB_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
          REPO:                    ${{ github.repository }}
        run: python scripts/process_dns_request.py

      - name: Add processing-failed label on error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              labels: ["processing-failed"]
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body: "## ❌ Workflow Error\n\nThe processing workflow failed unexpectedly. Please check the [Actions logs](" +
                    context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo +
                    "/actions) and contact the DNS team."
            });
